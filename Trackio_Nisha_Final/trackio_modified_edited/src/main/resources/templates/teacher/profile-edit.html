<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Edit Profile — Trackio-DIU</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" th:href="@{/css/main.css}"/>
  <style>
    .photo-edit-block {
      display: flex; align-items: center; gap: 24px;
      padding: 22px;
      background: var(--surface, #11111e);
      border: 1px dashed rgba(3,78,162,0.25);
      border-radius: 12px;
      margin-bottom: 28px;
    }
    .photo-edit-preview {
      width: 100px; height: 100px;
      border-radius: 50%;
      background: rgba(3,78,162,0.07);
      border: 2px solid rgba(3,78,162,0.25);
      display: flex; align-items: center; justify-content: center;
      color: var(--text-muted, #b8b8c8);
      font-size: 2.2rem; overflow: hidden;
      flex-shrink: 0;
    }
    .photo-edit-preview img { width: 100%; height: 100%; object-fit: cover; }
    .photo-edit-info h4 { margin-bottom: 4px; font-weight: 600; }
    .photo-edit-info p  { font-size: 0.85rem; color: var(--text-muted, #b8b8c8); margin-bottom: 12px; }
    .upload-btn-inline {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 9px 16px;
      background: linear-gradient(135deg, var(--diu-blue) 0%, var(--diu-blue-light) 100%);
      color: #ffffff; border-radius: 8px;
      font-weight: 600; font-size: 0.85rem;
      cursor: pointer; border: none;
    }
    .upload-btn-inline input[type=file] { display: none; }
    .upload-remove-inline {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 9px 14px;
      background: transparent; color: #ED1C24;
      border: 1px solid #ED1C24;
      border-radius: 8px;
      font-size: 0.83rem; cursor: pointer;
      margin-left: 8px;
    }
    .upload-filename-inline {
      font-size: 0.8rem; color: var(--diu-green-dark); margin-left: 10px;
      font-family: 'JetBrains Mono', 'SF Mono', monospace;
    }
    .section-block { margin-bottom: 28px; }
    .section-block h3 {
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 14px;
      color: var(--text-primary, #e8e8f0);
      display: flex; align-items: center; gap: 8px;
    }
    .section-block h3 i { color: var(--diu-blue); font-size: 0.9rem; }
  </style>
</head>
<body>
<div class="app-wrapper">
  <div th:replace="~{fragments/teacher-sidebar :: sidebar('profile')}"></div>
  <div class="main-content">
    <div class="topbar">
      <div class="topbar-title">
        <h1>Edit Profile</h1>
        <p>Update your photo, contact info, and professional details</p>
      </div>
      <div class="topbar-actions">
        <a th:href="@{/teacher/profile}" class="btn btn-secondary">← Cancel</a>
      </div>
    </div>

    <div class="content-area">
      <div th:if="${error}" class="alert alert-danger" style="margin-bottom:18px">
        <i class="fas fa-exclamation-triangle"></i> <span th:text="${error}"></span>
      </div>

      <div class="card" style="max-width:900px">
        <form th:action="@{/teacher/profile/update}"
              th:object="${teacher}"
              method="post"
              enctype="multipart/form-data">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <input type="hidden" name="removePhoto" id="removePhoto" value=""/>

          <!-- Photo -->
          <div class="section-block">
            <h3><i class="fas fa-camera"></i> Profile Photo</h3>
            <div class="photo-edit-block">
              <div class="photo-edit-preview" id="photoPreview"
                   th:with="hasPhoto=${teacher.teacherPhotoUrl != null and !#strings.isEmpty(teacher.teacherPhotoUrl)}">
                <img th:if="${hasPhoto}" th:src="${teacher.teacherPhotoUrl}" alt="preview"/>
                <i th:if="${!hasPhoto}" class="fas fa-user"></i>
              </div>
              <div class="photo-edit-info">
                <h4>Update your photo</h4>
                <p>JPG, PNG, GIF, or WebP up to 5MB.</p>
                <label class="upload-btn-inline">
                  <i class="fas fa-upload"></i>
                  <span>Choose New Photo</span>
                  <input type="file" name="photoFile" id="photoFile" accept="image/*"/>
                </label>
                <button type="button" class="upload-remove-inline" id="removePhotoBtn"
                        th:style="${teacher.teacherPhotoUrl == null} ? 'display:none' : ''">
                  <i class="fas fa-times"></i> Remove
                </button>
                <span class="upload-filename-inline" id="fileName"></span>
              </div>
            </div>
          </div>

          <!-- Basic Info -->
          <div class="section-block">
            <h3><i class="fas fa-user"></i> Basic Information</h3>
            <div class="form-grid">
              <div class="form-group form-full">
                <label>Full Name *</label>
                <input type="text" th:field="*{teacherName}" required/>
              </div>
              <div class="form-group">
                <label>Email</label>
                <input type="email" th:field="*{teacherEmail}"/>
              </div>
              <div class="form-group">
                <label>Phone</label>
                <input type="text" th:field="*{teacherPhone}"/>
              </div>
              <div class="form-group form-full">
                <label>Address</label>
                <input type="text" th:field="*{teacherAddress}" placeholder="House, Road, City, Country"/>
              </div>
            </div>
          </div>

          <!-- Professional Info -->
          <div class="section-block">
            <h3><i class="fas fa-briefcase"></i> Professional Information</h3>
            <div class="form-grid">
              <div class="form-group">
                <label>Department</label>
                <select th:field="*{teacherDepartment}">
                  <option value="">Select…</option>
                  <option value="Computer Science">Computer Science</option>
                  <option value="Software Engineering">Software Engineering</option>
                  <option value="Information Technology">Information Technology</option>
                  <option value="Electrical Engineering">Electrical Engineering</option>
                  <option value="Electronics &amp; Communication">Electronics &amp; Communication</option>
                  <option value="Mechanical Engineering">Mechanical Engineering</option>
                  <option value="Civil Engineering">Civil Engineering</option>
                  <option value="Business Administration">Business Administration</option>
                  <option value="Other">Other</option>
                </select>
              </div>
              <div class="form-group">
                <label>Designation</label>
                <select th:field="*{teacherDesignation}">
                  <option value="">Select…</option>
                  <option value="Lecturer">Lecturer</option>
                  <option value="Senior Lecturer">Senior Lecturer</option>
                  <option value="Assistant Professor">Assistant Professor</option>
                  <option value="Associate Professor">Associate Professor</option>
                  <option value="Professor">Professor</option>
                  <option value="Adjunct Faculty">Adjunct Faculty</option>
                  <option value="Visiting Faculty">Visiting Faculty</option>
                </select>
              </div>
              <div class="form-group">
                <label>Office Location</label>
                <input type="text" th:field="*{teacherOffice}" placeholder="Block A, Room 305"/>
              </div>
              <div class="form-group">
                <label>Specialization</label>
                <input type="text" th:field="*{teacherSpecialization}" placeholder="AI, Software Engineering…"/>
              </div>
              <div class="form-group form-full">
                <label>Short Bio</label>
                <textarea th:field="*{teacherBio}" rows="4"
                  placeholder="Research interests, teaching philosophy, background."></textarea>
              </div>
            </div>
          </div>

          <!-- Online Presence -->
          <div class="section-block">
            <h3><i class="fas fa-link"></i> Online Presence</h3>
            <div class="form-grid">
              <div class="form-group">
                <label><i class="fab fa-linkedin"></i>&nbsp;LinkedIn Profile</label>
                <input type="url" th:field="*{teacherLinkedinUrl}" placeholder="https://linkedin.com/in/yourname"/>
              </div>
              <div class="form-group">
                <label><i class="fas fa-globe"></i>&nbsp;Personal Website</label>
                <input type="url" th:field="*{teacherWebsite}" placeholder="https://yourwebsite.com"/>
              </div>
              <div class="form-group form-full">
                <label><i class="fab fa-github"></i>&nbsp;GitHub Profile</label>
                <input type="url" th:field="*{teacherGithubUrl}" placeholder="https://github.com/yourname"/>
              </div>
            </div>
          </div>

          <input type="hidden" th:field="*{teacherPhotoUrl}"/>

          <div style="margin-top:24px;display:flex;gap:12px;justify-content:flex-end">
            <a th:href="@{/teacher/profile}" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary">
              <i class="fas fa-floppy-disk"></i>&nbsp; Save Changes
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<script>
  (function() {
    const fileInput  = document.getElementById('photoFile');
    const preview    = document.getElementById('photoPreview');
    const fileName   = document.getElementById('fileName');
    const removeBtn  = document.getElementById('removePhotoBtn');
    const removeFlag = document.getElementById('removePhoto');

    fileInput.addEventListener('change', () => {
      const file = fileInput.files && fileInput.files[0];
      if (!file) return;
      if (file.size > 5 * 1024 * 1024) { alert('Image is too large. Maximum size is 5MB.'); fileInput.value=''; return; }
      if (!file.type.startsWith('image/')) { alert('Please choose an image file.'); fileInput.value=''; return; }
      const reader = new FileReader();
      reader.onload = (e) => { preview.innerHTML = '<img src="' + e.target.result + '" alt="preview"/>'; };
      reader.readAsDataURL(file);
      fileName.textContent = file.name;
      removeFlag.value = '';
      removeBtn.style.display = 'inline-flex';
    });

    removeBtn.addEventListener('click', () => {
      fileInput.value = '';
      preview.innerHTML = '<i class="fas fa-user"></i>';
      fileName.textContent = '';
      removeFlag.value = 'yes';
      removeBtn.style.display = 'none';
    });
  })();
</script>

</body>
</html>

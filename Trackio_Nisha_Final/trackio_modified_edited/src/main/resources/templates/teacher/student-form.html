<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><meta charset="UTF-8"/><title>Student Form</title><link rel="stylesheet" th:href="@{/css/main.css}"/></head>
<body>
<div class="app-wrapper">
  <div th:replace="~{fragments/teacher-sidebar :: sidebar('students')}"></div>
  <div class="main-content">
    <div class="topbar">
      <div class="topbar-title">
        <h1 th:text="${student.id != null} ? 'Edit Student' : 'New Student'">Form</h1>
        <p>Fill in student details below</p>
      </div>
      <div class="topbar-actions"><a th:href="@{/teacher/students}" class="btn btn-secondary">← Back</a></div>
    </div>
    <div class="content-area">
      <div class="card" style="max-width:800px">
        <form th:action="${student.id != null} ? @{/teacher/students/update/{id}(id=${student.id})} : @{/teacher/students/save}"
              th:object="${student}" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

          <div style="margin-bottom:20px">
            <div class="card-title" style="margin-bottom:16px">Academic Information</div>
            <div class="form-grid">
              <div class="form-group form-full">
                <label>Full Name *</label>
                <input type="text" th:field="*{name}" placeholder="e.g. Aisha Kabir" required/>
              </div>
              <div class="form-group">
                <label>Department</label>
                <input type="text" th:field="*{department}" placeholder="e.g. Computer Science"/>
              </div>
              <div class="form-group">
                <label>Registration No.</label>
                <input type="text" th:field="*{registrationNo}" placeholder="e.g. CSE-2024-001"/>
              </div>
              <div class="form-group">
                <label>Batch / Year</label>
                <input type="text" th:field="*{batch}" placeholder="e.g. 2024"/>
              </div>
            </div>
          </div>

          <div style="border-top:1px solid var(--border);padding-top:20px;margin-bottom:20px">
            <div class="card-title" style="margin-bottom:16px">Contact Information</div>
            <div class="form-grid">
              <div class="form-group">
                <label>Email</label>
                <input type="email" th:field="*{email}" placeholder="student@university.edu"/>
              </div>
              <div class="form-group">
                <label>Phone</label>
                <input type="text" th:field="*{phone}" placeholder="+880-..."/>
              </div>
              <div class="form-group form-full">
                <label>Address</label>
                <input type="text" th:field="*{address}" placeholder="City, Country"/>
              </div>
            </div>
          </div>

          <!-- Login credentials — only for new students -->
          <div th:if="${student.id == null}" style="border-top:1px solid var(--border);padding-top:20px;margin-bottom:20px">
            <div class="card-title" style="margin-bottom:8px">Login Credentials <span style="font-size:0.75rem;color:var(--diu-gray);font-weight:400">(optional — creates student login account)</span></div>
            <div class="form-grid">
              <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" placeholder="e.g. aisha.kabir"/>
              </div>
              <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Min. 8 characters"/>
              </div>
            </div>
          </div>

          <div style="display:flex;gap:12px">
            <button type="submit" class="btn btn-primary" th:text="${student.id != null} ? 'Update Student' : 'Create Student'">Save</button>
            <a th:href="@{/teacher/students}" class="btn btn-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
</body>
</html>

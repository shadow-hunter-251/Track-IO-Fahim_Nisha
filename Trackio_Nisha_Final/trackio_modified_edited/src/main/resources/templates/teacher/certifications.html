<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><meta charset="UTF-8"/><title>Certifications</title><link rel="stylesheet" th:href="@{/css/main.css}"/></head>
<body>
<div class="app-wrapper">
  <div th:replace="~{fragments/teacher-sidebar :: sidebar('certs')}"></div>
  <div class="main-content">
    <div class="topbar">
      <div class="topbar-title"><h1>All Certifications</h1><p>Professional certificates across all students</p></div>
      <div class="topbar-actions"><a th:href="@{/teacher/certifications/new}" class="btn btn-primary">+ Add Certification</a></div>
    </div>
    <div class="content-area">
      <div th:if="${success}" class="alert alert-success">✓ &nbsp;<span th:text="${success}"></span></div>
      <div class="card">
        <div th:if="${#lists.isEmpty(certs)}" class="empty-state"><div class="empty-icon">✦</div><h3>No certifications</h3></div>
        <div th:unless="${#lists.isEmpty(certs)}" class="table-container">
          <table>
            <thead><tr><th>Title</th><th>Student</th><th>Issuer</th><th>Issue Date</th><th>Expiry</th><th>Verified</th><th>Actions</th></tr></thead>
            <tbody>
            <tr th:each="c : ${certs}">
              <td class="td-name" th:text="${c.title}">T</td>
              <td th:text="${c.student != null ? c.student.name : '—'}">S</td>
              <td th:text="${c.issuingOrganization != null ? c.issuingOrganization : '—'}">O</td>
              <td th:text="${c.issueDate}">D</td>
              <td th:text="${c.expiryDate != null ? c.expiryDate : 'No Expiry'}">E</td>
              <td>
                <span th:if="${c.verified}" class="badge badge-verified">✓ Yes</span>
                <span th:unless="${c.verified}" class="badge badge-unverified">✗ No</span>
              </td>
              <td><div class="actions">
                <a th:href="@{/teacher/certifications/edit/{id}(id=${c.id})}" class="btn btn-secondary btn-sm">Edit</a>
                <form th:action="@{/teacher/certifications/verify/{id}(id=${c.id})}" method="post" style="display:inline">
                  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                  <input type="hidden" name="verified" th:value="${!c.verified}"/>
                  <button class="btn btn-sm" th:classappend="${c.verified} ? 'btn-warning' : 'btn-success'"
                          th:text="${c.verified} ? 'Unverify' : 'Verify'">Toggle</button>
                </form>
                <form th:action="@{/teacher/certifications/delete/{id}(id=${c.id})}" method="post" style="display:inline" onsubmit="return confirm('Delete?')">
                  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                  <button class="btn btn-danger btn-sm">Delete</button>
                </form>
              </div></td>
            </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>

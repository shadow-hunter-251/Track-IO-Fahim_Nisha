<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><meta charset="UTF-8"/><title>Project Form</title><link rel="stylesheet" th:href="@{/css/main.css}"/></head>
<body>
<div class="app-wrapper">
  <div th:replace="~{fragments/teacher-sidebar :: sidebar('projects')}"></div>
  <div class="main-content">
    <div class="topbar">
      <div class="topbar-title"><h1 th:text="${project.id != null} ? 'Edit Project' : 'New Project'">Form</h1></div>
      <div class="topbar-actions"><a th:href="@{/teacher/projects}" class="btn btn-secondary">← Back</a></div>
    </div>
    <div class="content-area">
      <div class="card" style="max-width:780px">
        <form th:action="${project.id != null} ? @{/teacher/projects/update/{id}(id=${project.id})} : @{/teacher/projects/save}"
              th:object="${project}" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <div class="form-grid">
            <div class="form-group form-full"><label>Project Title *</label><input type="text" th:field="*{title}" required/></div>
            <div class="form-group">
              <label>Student *</label>
              <select name="studentId" required>
                <option value="">-- Select Student --</option>
                <option th:each="s : ${students}" th:value="${s.id}" th:text="${s.name + ' (' + s.studentId + ')' }"
                        th:selected="${project.student != null and project.student.id == s.id}">Student</option>
              </select>
            </div>
            <div class="form-group">
              <label>Project Type</label>
              <select th:field="*{projectType}">
                <option th:each="t : ${types}" th:value="${t}" th:text="${t}">Type</option>
              </select>
            </div>
            <div class="form-group"><label>Course Name</label><input type="text" th:field="*{courseName}"/></div>
            <div class="form-group"><label>Supervisor</label><input type="text" th:field="*{supervisor}"/></div>
            <div class="form-group"><label>Start Date</label><input type="date" th:field="*{startDate}"/></div>
            <div class="form-group"><label>End Date</label><input type="date" th:field="*{endDate}"/></div>
            <div class="form-group form-full"><label>Description</label><textarea th:field="*{description}"></textarea></div>
          </div>
          <div style="margin-top:24px;display:flex;gap:12px">
            <button type="submit" class="btn btn-primary" th:text="${project.id != null} ? 'Update' : 'Save Project'">Save</button>
            <a th:href="@{/teacher/projects}" class="btn btn-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
</body>
</html>

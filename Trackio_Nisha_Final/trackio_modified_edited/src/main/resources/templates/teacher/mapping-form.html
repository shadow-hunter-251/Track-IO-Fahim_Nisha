<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><meta charset="UTF-8"/><title>Mapping Form</title><link rel="stylesheet" th:href="@{/css/main.css}"/></head>
<body>
<div class="app-wrapper">
  <div th:replace="~{fragments/teacher-sidebar :: sidebar('mappings')}"></div>
  <div class="main-content">
    <div class="topbar">
      <div class="topbar-title"><h1 th:text="${mapping.id != null} ? 'Edit Mapping' : 'New Skill Mapping'">Form</h1></div>
      <div class="topbar-actions"><a th:href="@{/teacher/skill-mappings}" class="btn btn-secondary">← Back</a></div>
    </div>
    <div class="content-area">
      <div class="card" style="max-width:720px">
        <form th:action="${mapping.id != null} ? @{/teacher/skill-mappings/update/{id}(id=${mapping.id})} : @{/teacher/skill-mappings/save}"
              th:object="${mapping}" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <div class="form-grid">
            <div class="form-group form-full">
              <label>Skill *</label>
              <select name="skillId" required>
                <option value="">-- Select Skill --</option>
                <option th:each="s : ${skills}" th:value="${s.id}" th:text="${s.skillName + ' (' + s.category + ')'}"
                        th:selected="${mapping.skill != null and mapping.skill.id == s.id}">Skill</option>
              </select>
            </div>
            <div class="form-group form-full"><label>Course / Learning Outcome</label><input type="text" th:field="*{courseOutcome}" placeholder="e.g. CO1: Apply OOP principles"/></div>
            <div class="form-group form-full"><label>Program Outcome</label><input type="text" th:field="*{programOutcome}" placeholder="e.g. PO3: Design software systems"/></div>
            <div class="form-group">
              <label>Proficiency Level</label>
              <select th:field="*{proficiencyLevel}">
                <option value="">-- Select --</option>
                <option th:each="l : ${levels}" th:value="${l}" th:text="${l}">Level</option>
              </select>
            </div>
          </div>
          <div style="margin-top:24px;display:flex;gap:12px">
            <button type="submit" class="btn btn-primary" th:text="${mapping.id != null} ? 'Update' : 'Save Mapping'">Save</button>
            <a th:href="@{/teacher/skill-mappings}" class="btn btn-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
</body>
</html>

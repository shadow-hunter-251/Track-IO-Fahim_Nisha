<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><meta charset="UTF-8"/><title>Students</title><link rel="stylesheet" th:href="@{/css/main.css}"/></head>
<body>
<div class="app-wrapper">
  <div th:replace="~{fragments/teacher-sidebar :: sidebar('students')}"></div>
  <div class="main-content">
    <div class="topbar">
      <div class="topbar-title"><h1>Student Management</h1><p>View, add, edit and manage all students</p></div>
      <div class="topbar-actions"><a th:href="@{/teacher/students/new}" class="btn btn-primary">+ New Student</a></div>
    </div>
    <div class="content-area">
      <div th:if="${success}" class="alert alert-success">✓ &nbsp;<span th:text="${success}"></span></div>
      <div class="card">
        <div th:if="${#lists.isEmpty(students)}" class="empty-state">
          <div class="empty-icon">◉</div><h3>No students yet</h3>
          <a th:href="@{/teacher/students/new}" class="btn btn-primary">+ Add Student</a>
        </div>
        <div th:unless="${#lists.isEmpty(students)}" class="table-container">
          <table>
            <thead><tr><th>Student ID</th><th>Name</th><th>Department</th><th>Reg. No.</th><th>Batch</th><th>Email</th><th>Actions</th></tr></thead>
            <tbody>
            <tr th:each="s : ${students}">
              <td class="td-id" th:text="${s.studentId}">ID</td>
              <td><div class="td-name" th:text="${s.name}">Name</div></td>
              <td th:text="${s.department != null ? s.department : '—'}">Dept</td>
              <td th:text="${s.registrationNo != null ? s.registrationNo : '—'}">Reg</td>
              <td th:text="${s.batch != null ? s.batch : '—'}">Batch</td>
              <td th:text="${s.email != null ? s.email : '—'}">Email</td>
              <td><div class="actions">
                <a th:href="@{/teacher/students/view/{id}(id=${s.id})}" class="btn btn-secondary btn-sm">View</a>
                <a th:href="@{/teacher/students/edit/{id}(id=${s.id})}" class="btn btn-secondary btn-sm">Edit</a>
                <form th:action="@{/teacher/students/delete/{id}(id=${s.id})}" method="post" style="display:inline" onsubmit="return confirm('Delete this student?')">
                  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                  <button class="btn btn-danger btn-sm">Delete</button>
                </form>
              </div></td>
            </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>

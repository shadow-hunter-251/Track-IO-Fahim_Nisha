<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><meta charset="UTF-8"/><title>Projects</title><link rel="stylesheet" th:href="@{/css/main.css}"/></head>
<body>
<div class="app-wrapper">
  <div th:replace="~{fragments/teacher-sidebar :: sidebar('projects')}"></div>
  <div class="main-content">
    <div class="topbar">
      <div class="topbar-title"><h1>All Projects</h1><p>Projects, assignments and capstone work across all students</p></div>
      <div class="topbar-actions"><a th:href="@{/teacher/projects/new}" class="btn btn-primary">+ New Project</a></div>
    </div>
    <div class="content-area">
      <div th:if="${success}" class="alert alert-success">✓ &nbsp;<span th:text="${success}"></span></div>
      <div class="card">
        <div th:if="${#lists.isEmpty(projects)}" class="empty-state">
          <div class="empty-icon">◈</div><h3>No projects yet</h3>
          <a th:href="@{/teacher/projects/new}" class="btn btn-primary">+ Add Project</a>
        </div>
        <div th:unless="${#lists.isEmpty(projects)}" class="table-container">
          <table>
            <thead><tr><th>Title</th><th>Student</th><th>Type</th><th>Course</th><th>Supervisor</th><th>Period</th><th>Actions</th></tr></thead>
            <tbody>
            <tr th:each="p : ${projects}">
              <td class="td-name" th:text="${p.title}">T</td>
              <td th:text="${p.student != null ? p.student.name : '—'}">S</td>
              <td><span class="badge" th:classappend="${p.projectType.name().toLowerCase() == 'capstone'} ? 'badge-capstone' : (${p.projectType.name().toLowerCase() == 'project'} ? 'badge-project' : 'badge-assignment')" th:text="${p.projectType}">T</span></td>
              <td th:text="${p.courseName != null ? p.courseName : '—'}">C</td>
              <td th:text="${p.supervisor != null ? p.supervisor : '—'}">Sup</td>
              <td style="font-size:0.78rem" th:text="${(p.startDate != null ? p.startDate : '?') + ' → ' + (p.endDate != null ? p.endDate : 'Ongoing')}">D</td>
              <td><div class="actions">
                <a th:href="@{/teacher/projects/edit/{id}(id=${p.id})}" class="btn btn-secondary btn-sm">Edit</a>
                <form th:action="@{/teacher/projects/delete/{id}(id=${p.id})}" method="post" style="display:inline" onsubmit="return confirm('Delete?')">
                  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                  <button class="btn btn-danger btn-sm">Delete</button>
                </form>
              </div></td>
            </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>

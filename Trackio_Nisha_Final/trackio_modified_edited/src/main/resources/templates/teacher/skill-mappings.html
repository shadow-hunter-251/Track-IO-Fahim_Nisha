<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><meta charset="UTF-8"/><title>Skill Mappings</title><link rel="stylesheet" th:href="@{/css/main.css}"/></head>
<body>
<div class="app-wrapper">
  <div th:replace="~{fragments/teacher-sidebar :: sidebar('mappings')}"></div>
  <div class="main-content">
    <div class="topbar">
      <div class="topbar-title"><h1>Skill-to-Outcome Mappings</h1><p>Map skills to course and program learning outcomes</p></div>
      <div class="topbar-actions"><a th:href="@{/teacher/skill-mappings/new}" class="btn btn-primary">+ New Mapping</a></div>
    </div>
    <div class="content-area">
      <div th:if="${success}" class="alert alert-success">✓ &nbsp;<span th:text="${success}"></span></div>
      <div class="card">
        <div th:if="${#lists.isEmpty(mappings)}" class="empty-state">
          <div class="empty-icon">⇄</div><h3>No mappings defined</h3>
          <p>Map skills to program learning outcomes to track competency coverage.</p>
          <a th:href="@{/teacher/skill-mappings/new}" class="btn btn-primary">+ Add Mapping</a>
        </div>
        <div th:unless="${#lists.isEmpty(mappings)}" class="table-container">
          <table>
            <thead><tr><th>Mapping ID</th><th>Skill</th><th>Course Outcome</th><th>Program Outcome</th><th>Proficiency</th><th>Actions</th></tr></thead>
            <tbody>
            <tr th:each="m : ${mappings}">
              <td class="td-id" th:text="${m.mappingId}">ID</td>
              <td class="td-name" th:text="${m.skill != null ? m.skill.skillName : '—'}">Skill</td>
              <td style="max-width:200px;font-size:0.82rem" th:text="${m.courseOutcome != null ? m.courseOutcome : '—'}">CO</td>
              <td style="max-width:200px;font-size:0.82rem" th:text="${m.programOutcome != null ? m.programOutcome : '—'}">PO</td>
              <td><span class="badge"
                        th:classappend="${m.proficiencyLevel != null and m.proficiencyLevel.name() == 'EXPERT'} ? 'badge-advanced' : (${m.proficiencyLevel != null and m.proficiencyLevel.name() == 'PROFICIENT'} ? 'badge-intermediate' : 'badge-beginner')"
                        th:text="${m.proficiencyLevel != null ? m.proficiencyLevel : '—'}">Level</span></td>
              <td><div class="actions">
                <a th:href="@{/teacher/skill-mappings/edit/{id}(id=${m.id})}" class="btn btn-secondary btn-sm">Edit</a>
                <form th:action="@{/teacher/skill-mappings/delete/{id}(id=${m.id})}" method="post" style="display:inline" onsubmit="return confirm('Delete?')">
                  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                  <button class="btn btn-danger btn-sm">Delete</button>
                </form>
              </div></td>
            </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><meta charset="UTF-8"/><title>Achievement Form</title><link rel="stylesheet" th:href="@{/css/main.css}"/></head>
<body>
<div class="app-wrapper">
  <div th:replace="~{fragments/teacher-sidebar :: sidebar('achievements')}"></div>
  <div class="main-content">
    <div class="topbar">
      <div class="topbar-title"><h1 th:text="${achievement.id != null} ? 'Edit Achievement' : 'Add Achievement'">Form</h1></div>
      <div class="topbar-actions"><a th:href="@{/teacher/achievements}" class="btn btn-secondary">← Back</a></div>
    </div>
    <div class="content-area">
      <div class="card" style="max-width:700px">
        <form th:action="${achievement.id != null} ? @{/teacher/achievements/update/{id}(id=${achievement.id})} : @{/teacher/achievements/save}"
              th:object="${achievement}" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <div class="form-grid">
            <div class="form-group form-full"><label>Event Name *</label><input type="text" th:field="*{eventName}" required/></div>
            <div class="form-group form-full">
              <label>Student *</label>
              <select name="studentId" required>
                <option value="">-- Select Student --</option>
                <option th:each="s : ${students}" th:value="${s.id}" th:text="${s.name}"
                        th:selected="${achievement.student != null and achievement.student.id == s.id}">S</option>
              </select>
            </div>
            <div class="form-group"><label>Position / Result</label><input type="text" th:field="*{position}"/></div>
            <div class="form-group"><label>Organizer</label><input type="text" th:field="*{organizer}"/></div>
            <div class="form-group"><label>Date</label><input type="date" th:field="*{date}"/></div>
            <div class="form-group"><label>Proof / Link</label><input type="url" th:field="*{proofLink}"/></div>
            <div class="form-group form-full">
              <label>Verified by Teacher</label>
              <div class="radio-group">
                <label class="radio-label">
                  <input type="radio" name="verifiedParam" value="yes" th:checked="${achievement.verified}"/> Yes
                </label>
                <label class="radio-label">
                  <input type="radio" name="verifiedParam" value="no" th:checked="${!achievement.verified}"/> No
                </label>
              </div>
            </div>
          </div>
          <div style="margin-top:24px;display:flex;gap:12px">
            <button type="submit" class="btn btn-primary" th:text="${achievement.id != null} ? 'Update' : 'Save'">Save</button>
            <a th:href="@{/teacher/achievements}" class="btn btn-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
</body>
</html>

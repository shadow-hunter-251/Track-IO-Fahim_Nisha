<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><meta charset="UTF-8"/><title>Achievements</title><link rel="stylesheet" th:href="@{/css/main.css}"/></head>
<body>
<div class="app-wrapper">
  <div th:replace="~{fragments/student-sidebar :: sidebar('achievements')}"></div>
  <div class="main-content">
    <div class="topbar">
      <div class="topbar-title"><h1>Achievements</h1><p>Competitions, Awards &amp; Recognitions</p></div>
      <div class="topbar-actions"><a th:href="@{/student/achievements/new}" class="btn btn-primary">+ Add Achievement</a></div>
    </div>
    <div class="content-area">
      <div th:if="${success}" class="alert alert-success">✓ &nbsp;<span th:text="${success}"></span></div>
      <div class="card">
        <div th:if="${#lists.isEmpty(achievements)}" class="empty-state">
          <div class="empty-icon">★</div><h3>No achievements yet</h3>
          <p>Record your competitions, awards, and recognitions.</p>
          <a th:href="@{/student/achievements/new}" class="btn btn-primary">+ Add Achievement</a>
        </div>
        <div th:unless="${#lists.isEmpty(achievements)}" class="table-container">
          <table>
            <thead><tr><th>Event</th><th>Position</th><th>Organizer</th><th>Date</th><th>Verified</th><th>Proof</th><th>Actions</th></tr></thead>
            <tbody>
            <tr th:each="a : ${achievements}">
              <td class="td-name" th:text="${a.eventName}">Event</td>
              <td><span style="color:var(--blush);font-weight:600" th:text="${a.position}">Position</span></td>
              <td th:text="${a.organizer}">Org</td>
              <td th:text="${a.date}">Date</td>
              <td>
                <span th:if="${a.verified}" class="badge badge-verified">✓ Verified</span>
                <span th:unless="${a.verified}" class="badge badge-unverified">Pending</span>
              </td>
              <td><a th:if="${a.proofLink != null}" th:href="${a.proofLink}" target="_blank" style="color:var(--blush);font-size:0.8rem">View ↗</a><span th:unless="${a.proofLink != null}">—</span></td>
              <td><div class="actions">
                <a th:href="@{/student/achievements/edit/{id}(id=${a.id})}" class="btn btn-secondary btn-sm">Edit</a>
                <form th:action="@{/student/achievements/delete/{id}(id=${a.id})}" method="post" style="display:inline" onsubmit="return confirm('Delete?')">
                  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                  <button class="btn btn-danger btn-sm">Delete</button>
                </form>
              </div></td>
            </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><meta charset="UTF-8"/><title>Internship Form</title><link rel="stylesheet" th:href="@{/css/main.css}"/></head>
<body>
<div class="app-wrapper">
  <div th:replace="~{fragments/student-sidebar :: sidebar('internships')}"></div>
  <div class="main-content">
    <div class="topbar">
      <div class="topbar-title"><h1 th:text="${internship.id != null} ? 'Edit Internship' : 'Add Internship'">Form</h1></div>
      <div class="topbar-actions"><a th:href="@{/student/internships}" class="btn btn-secondary">← Back</a></div>
    </div>
    <div class="content-area">
      <div class="card" style="max-width:700px">
        <form th:action="${internship.id != null} ? @{/student/internships/update/{id}(id=${internship.id})} : @{/student/internships/save}"
              th:object="${internship}" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <div class="form-grid">
            <div class="form-group"><label>Company Name *</label><input type="text" th:field="*{companyName}" placeholder="e.g. Brain Station 23" required/></div>
            <div class="form-group"><label>Role / Position *</label><input type="text" th:field="*{role}" placeholder="e.g. Backend Developer Intern" required/></div>
            <div class="form-group"><label>Start Date</label><input type="date" th:field="*{startDate}"/></div>
            <div class="form-group"><label>End Date</label><input type="date" th:field="*{endDate}"/></div>
            <div class="form-group form-full"><label>Status</label>
              <select th:field="*{status}">
                <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}">Status</option>
              </select>
            </div>
          </div>
          <div style="margin-top:24px;display:flex;gap:12px">
            <button type="submit" class="btn btn-primary" th:text="${internship.id != null} ? 'Update' : 'Save Record'">Save</button>
            <a th:href="@{/student/internships}" class="btn btn-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><meta charset="UTF-8"/><title>Certification Form</title><link rel="stylesheet" th:href="@{/css/main.css}"/></head>
<body>
<div class="app-wrapper">
  <div th:replace="~{fragments/student-sidebar :: sidebar('certs')}"></div>
  <div class="main-content">
    <div class="topbar">
      <div class="topbar-title"><h1 th:text="${cert.id != null} ? 'Edit Certification' : 'Add Certification'">Form</h1></div>
      <div class="topbar-actions"><a th:href="@{/student/certifications}" class="btn btn-secondary">← Back</a></div>
    </div>
    <div class="content-area">
      <div class="card" style="max-width:700px">
        <form th:action="${cert.id != null} ? @{/student/certifications/update/{id}(id=${cert.id})} : @{/student/certifications/save}"
              th:object="${cert}" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <div class="form-grid">
            <div class="form-group form-full"><label>Certificate Title *</label><input type="text" th:field="*{title}" placeholder="e.g. AWS Cloud Practitioner" required/></div>
            <div class="form-group"><label>Issuing Organization</label><input type="text" th:field="*{issuingOrganization}" placeholder="e.g. Amazon Web Services"/></div>
            <div class="form-group"><label>Issue Date</label><input type="date" th:field="*{issueDate}"/></div>
            <div class="form-group"><label>Expiry Date (if any)</label><input type="date" th:field="*{expiryDate}"/></div>
            <div class="form-group form-full"><label>Certificate Link / File URL</label><input type="url" th:field="*{certificateLink}" placeholder="https://..."/></div>
          </div>
          <div style="margin-top:24px;display:flex;gap:12px">
            <button type="submit" class="btn btn-primary" th:text="${cert.id != null} ? 'Update' : 'Save Certification'">Save</button>
            <a th:href="@{/student/certifications}" class="btn btn-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
</body>
</html>

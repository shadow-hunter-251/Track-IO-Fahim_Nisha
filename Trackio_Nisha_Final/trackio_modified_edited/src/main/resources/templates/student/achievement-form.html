<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><meta charset="UTF-8"/><title>Achievement Form</title><link rel="stylesheet" th:href="@{/css/main.css}"/></head>
<body>
<div class="app-wrapper">
  <div th:replace="~{fragments/student-sidebar :: sidebar('achievements')}"></div>
  <div class="main-content">
    <div class="topbar">
      <div class="topbar-title"><h1 th:text="${achievement.id != null} ? 'Edit Achievement' : 'Add Achievement'">Form</h1></div>
      <div class="topbar-actions"><a th:href="@{/student/achievements}" class="btn btn-secondary">← Back</a></div>
    </div>
    <div class="content-area">
      <div class="card" style="max-width:700px">
        <form th:action="${achievement.id != null} ? @{/student/achievements/update/{id}(id=${achievement.id})} : @{/student/achievements/save}"
              th:object="${achievement}" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <div class="form-grid">
            <div class="form-group form-full"><label>Event Name *</label><input type="text" th:field="*{eventName}" placeholder="e.g. National Hackathon 2024" required/></div>
            <div class="form-group"><label>Position / Result</label><input type="text" th:field="*{position}" placeholder="e.g. 1st Place, Best Paper"/></div>
            <div class="form-group"><label>Organizer</label><input type="text" th:field="*{organizer}" placeholder="e.g. IEEE Bangladesh"/></div>
            <div class="form-group"><label>Date</label><input type="date" th:field="*{date}"/></div>
            <div class="form-group form-full"><label>Proof / Link</label><input type="url" th:field="*{proofLink}" placeholder="https://..."/></div>
          </div>
          <div style="margin-top:24px;display:flex;gap:12px">
            <button type="submit" class="btn btn-primary" th:text="${achievement.id != null} ? 'Update' : 'Save Achievement'">Save</button>
            <a th:href="@{/student/achievements}" class="btn btn-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
</body>
</html>

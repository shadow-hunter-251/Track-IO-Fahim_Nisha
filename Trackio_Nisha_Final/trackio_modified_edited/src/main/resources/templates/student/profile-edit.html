<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Edit Profile — Trackio-DIU</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" th:href="@{/css/main.css}"/>
  <style>
    /* Local additions for the edit-photo block */
    .photo-edit-block {
      display: flex; align-items: center; gap: 24px;
      padding: 22px;
      background: var(--surface, #11111e);
      border: 1px dashed rgba(3,78,162,0.25);
      border-radius: 12px;
      margin-bottom: 28px;
    }
    .photo-edit-preview {
      width: 100px; height: 100px;
      border-radius: 50%;
      background: rgba(3,78,162,0.07);
      border: 2px solid rgba(3,78,162,0.25);
      display: flex; align-items: center; justify-content: center;
      color: var(--text-muted, #b8b8c8);
      font-size: 2.2rem; overflow: hidden;
      flex-shrink: 0;
    }
    .photo-edit-preview img { width: 100%; height: 100%; object-fit: cover; }
    .photo-edit-info h4 { margin-bottom: 4px; font-weight: 600; }
    .photo-edit-info p  { font-size: 0.85rem; color: var(--text-muted, #b8b8c8); margin-bottom: 12px; }
    .upload-btn-inline {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 9px 16px;
      background: linear-gradient(135deg, #034EA2 0%, #0560c4 100%);
      color: #ffffff; border-radius: 8px;
      font-weight: 600; font-size: 0.85rem;
      cursor: pointer; border: none;
    }
    .upload-btn-inline input[type=file] { display: none; }
    .upload-remove-inline {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 9px 14px;
      background: transparent; color: #ED1C24;
      border: 1px solid #ED1C24;
      border-radius: 8px;
      font-size: 0.83rem; cursor: pointer;
      margin-left: 8px;
    }
    .upload-filename-inline {
      font-size: 0.8rem; color: #39B54A; margin-left: 10px;
      font-family: 'JetBrains Mono', 'SF Mono', monospace;
    }

    .section-block { margin-bottom: 28px; }
    .section-block h3 {
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 14px;
      color: var(--text-primary, #e8e8f0);
      display: flex; align-items: center; gap: 8px;
    }
    .section-block h3 i { color: #034EA2; font-size: 0.9rem; }
  </style>
</head>
<body>
<div class="app-wrapper">
  <div th:replace="~{fragments/student-sidebar :: sidebar('profile')}"></div>
  <div class="main-content">
    <div class="topbar">
      <div class="topbar-title">
        <h1>Edit Profile</h1>
        <p>Update your photo, contact info, and portfolio links</p>
      </div>
      <div class="topbar-actions">
        <a th:href="@{/student/profile}" class="btn btn-secondary">← Cancel</a>
      </div>
    </div>

    <div class="content-area">
      <div th:if="${error}" class="alert alert-danger" style="margin-bottom:18px">
        <i class="fas fa-exclamation-triangle"></i> <span th:text="${error}"></span>
      </div>

      <div class="card" style="max-width:900px">
        <form th:action="@{/student/profile/update}"
              th:object="${student}"
              method="post"
              enctype="multipart/form-data">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <input type="hidden" name="removePhoto" id="removePhoto" value=""/>

          <!-- ============== Profile Photo ============== -->
          <div class="section-block">
            <h3><i class="fas fa-camera"></i> Profile Photo</h3>

            <div class="photo-edit-block">
              <div class="photo-edit-preview" id="photoPreview"
                   th:with="hasPhoto=${student.profilePhotoUrl != null and !#strings.isEmpty(student.profilePhotoUrl)}">
                <img th:if="${hasPhoto}" th:src="${student.profilePhotoUrl}" alt="preview"/>
                <i th:if="${!hasPhoto}" class="fas fa-user"></i>
              </div>
              <div class="photo-edit-info">
                <h4>Update your photo</h4>
                <p>JPG, PNG, GIF, or WebP up to 5MB. Appears across dashboard, profile, and CV.</p>
                <label class="upload-btn-inline">
                  <i class="fas fa-upload"></i>
                  <span>Choose New Photo</span>
                  <input type="file" name="photoFile" id="photoFile" accept="image/*"/>
                </label>
                <button type="button" class="upload-remove-inline" id="removePhotoBtn"
                        th:style="${student.profilePhotoUrl == null} ? 'display:none' : ''">
                  <i class="fas fa-times"></i> Remove
                </button>
                <span class="upload-filename-inline" id="fileName"></span>
              </div>
            </div>
          </div>

          <!-- ============== Basic Info ============== -->
          <div class="section-block">
            <h3><i class="fas fa-user"></i> Basic Information</h3>
            <div class="form-grid">
              <div class="form-group form-full">
                <label>Full Name *</label>
                <input type="text" th:field="*{name}" required/>
              </div>
              <div class="form-group">
                <label>Email</label>
                <input type="email" th:field="*{email}" placeholder="your@email.com"/>
              </div>
              <div class="form-group">
                <label>Phone</label>
                <input type="text" th:field="*{phone}" placeholder="+880-..."/>
              </div>
              <div class="form-group form-full">
                <label>Address</label>
                <input type="text" th:field="*{address}" placeholder="House, Road, City, Country"/>
              </div>
            </div>
          </div>

          <!-- ============== Portfolio Links ============== -->
          <div class="section-block">
            <h3><i class="fas fa-link"></i> Portfolio &amp; Online Accounts</h3>
            <div class="form-grid">
              <div class="form-group">
                <label><i class="fab fa-github"></i>&nbsp;GitHub Profile</label>
                <input type="url" th:field="*{githubUrl}" placeholder="https://github.com/yourname"/>
              </div>
              <div class="form-group">
                <label><i class="fab fa-linkedin"></i>&nbsp;LinkedIn Profile</label>
                <input type="url" th:field="*{linkedinUrl}" placeholder="https://linkedin.com/in/yourname"/>
              </div>
              <div class="form-group">
                <label><i class="fas fa-globe"></i>&nbsp;Personal Portfolio Website</label>
                <input type="url" th:field="*{portfolioUrl}" placeholder="https://yourportfolio.com"/>
              </div>
              <div class="form-group">
                <label><i class="fas fa-file-pdf"></i>&nbsp;CV / Resume URL</label>
                <input type="url" th:field="*{cvUrl}" placeholder="https://drive.google.com/file/..."/>
              </div>
            </div>
          </div>

          <!-- ============== About / Skills ============== -->
          <div class="section-block">
            <h3><i class="fas fa-circle-info"></i> About &amp; Skills</h3>
            <div class="form-grid">
              <div class="form-group form-full">
                <label>Skills (comma-separated)</label>
                <input type="text" th:field="*{skills}" placeholder="Java, Spring Boot, React, Python, SQL"/>
              </div>
              <div class="form-group form-full">
                <label>Short Bio / About Me</label>
                <textarea th:field="*{bio}" rows="4"
                  placeholder="A few lines about yourself — interests, goals, what you're building."></textarea>
              </div>
            </div>
          </div>

          <!-- Hidden URL fallback used by signup; kept here so it round-trips on save -->
          <input type="hidden" th:field="*{profilePhotoUrl}"/>

          <div style="margin-top:24px;display:flex;gap:12px;justify-content:flex-end">
            <a th:href="@{/student/profile}" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary">
              <i class="fas fa-floppy-disk"></i>&nbsp; Save Changes
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<script>
  // Photo upload preview + remove
  (function() {
    const fileInput  = document.getElementById('photoFile');
    const preview    = document.getElementById('photoPreview');
    const fileName   = document.getElementById('fileName');
    const removeBtn  = document.getElementById('removePhotoBtn');
    const removeFlag = document.getElementById('removePhoto');

    fileInput.addEventListener('change', () => {
      const file = fileInput.files && fileInput.files[0];
      if (!file) return;
      if (file.size > 5 * 1024 * 1024) {
        alert('Image is too large. Maximum size is 5MB.');
        fileInput.value = ''; return;
      }
      if (!file.type.startsWith('image/')) {
        alert('Please choose an image file.');
        fileInput.value = ''; return;
      }
      const reader = new FileReader();
      reader.onload = (e) => {
        preview.innerHTML = '<img src="' + e.target.result + '" alt="preview"/>';
      };
      reader.readAsDataURL(file);
      fileName.textContent = file.name;
      removeFlag.value = '';   // cancel any pending "remove" intent
      removeBtn.style.display = 'inline-flex';
    });

    removeBtn.addEventListener('click', () => {
      fileInput.value = '';
      preview.innerHTML = '<i class="fas fa-user"></i>';
      fileName.textContent = '';
      removeFlag.value = 'yes';
      removeBtn.style.display = 'none';
    });
  })();
</script>

</body>
</html>

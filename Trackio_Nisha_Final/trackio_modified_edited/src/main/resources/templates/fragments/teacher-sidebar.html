<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<aside th:fragment="sidebar(active)" class="sidebar">

  <div class="sidebar-brand">
    <div class="brand-icon-wrapper">
      <svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
        <line x1="3" y1="11" x2="25" y2="11" stroke="rgba(255,255,255,0.45)" stroke-width="1.8" stroke-linecap="round"/>
        <line x1="3" y1="19" x2="25" y2="19" stroke="rgba(255,255,255,0.45)" stroke-width="1.8" stroke-linecap="round"/>
        <line x1="7"  y1="8" x2="7"  y2="22" stroke="rgba(255,255,255,0.3)" stroke-width="1.4" stroke-linecap="round"/>
        <line x1="14" y1="8" x2="14" y2="22" stroke="rgba(255,255,255,0.3)" stroke-width="1.4" stroke-linecap="round"/>
        <line x1="21" y1="8" x2="21" y2="22" stroke="rgba(255,255,255,0.3)" stroke-width="1.4" stroke-linecap="round"/>
        <line x1="7"  y1="8" x2="21" y2="8"  stroke="white" stroke-width="3" stroke-linecap="round"/>
        <line x1="14" y1="8" x2="14" y2="22" stroke="white" stroke-width="3" stroke-linecap="round"/>
        <circle cx="21" cy="20" r="3" fill="#39B54A"/>
        <circle cx="21" cy="20" r="1.4" fill="white"/>
      </svg>
    </div>
    <h2>Trackio-DIU</h2>
    <p>Teacher Portal · DIU</p>
  </div>

  <div class="sidebar-user">
    <div class="user-avatar"
         th:with="hasPhoto=${teacher != null and teacher.teacherPhotoUrl != null and !#strings.isEmpty(teacher.teacherPhotoUrl)}"
         th:style="${hasPhoto} ? |background-image:url('${teacher.teacherPhotoUrl}');background-size:cover;background-position:center;color:transparent| : ''">
      <span th:if="${!hasPhoto}" th:text="${teacher != null ? teacher.teacherName.substring(0,1) : 'T'}">T</span>
    </div>
    <div class="user-info">
      <strong th:text="${teacher != null ? teacher.teacherName : 'Teacher'}">Teacher</strong>
      <span>Assistant Professor</span>
    </div>
  </div>

  <nav class="sidebar-nav">
    <div class="nav-section-label">Overview</div>
    <a th:href="@{/teacher/dashboard}" class="nav-link" th:classappend="${active == 'dashboard'} ? 'active'">
      <span class="nav-icon">⊞</span> Dashboard
    </a>
    <a th:href="@{/teacher/profile}" class="nav-link" th:classappend="${active == 'profile'} ? 'active'">
      <span class="nav-icon">◉</span> My Profile
    </a>

    <div class="nav-section-label" style="margin-top:8px">Student Management</div>
    <a th:href="@{/teacher/students}" class="nav-link" th:classappend="${active == 'students'} ? 'active'">
      <span class="nav-icon">◉</span> Students
    </a>
    <a th:href="@{/teacher/projects}" class="nav-link" th:classappend="${active == 'projects'} ? 'active'">
      <span class="nav-icon">◈</span> Projects
    </a>
    <a th:href="@{/teacher/certifications}" class="nav-link" th:classappend="${active == 'certs'} ? 'active'">
      <span class="nav-icon">✦</span> Certifications
    </a>
    <a th:href="@{/teacher/achievements}" class="nav-link" th:classappend="${active == 'achievements'} ? 'active'">
      <span class="nav-icon">★</span> Achievements
    </a>
    <a th:href="@{/teacher/internships}" class="nav-link" th:classappend="${active == 'internships'} ? 'active'">
      <span class="nav-icon">⚙</span> Internships
    </a>

    <div class="nav-section-label" style="margin-top:8px">Skills</div>
    <a th:href="@{/teacher/skills}" class="nav-link" th:classappend="${active == 'skills'} ? 'active'">
      <span class="nav-icon">◆</span> Student Skills
    </a>

    <div class="nav-section-label" style="margin-top:8px">Insights</div>
    <a th:href="@{/teacher/analytics}" class="nav-link" th:classappend="${active == 'analytics'} ? 'active'">
      <span class="nav-icon">📊</span> Analytics
    </a>

    <div class="nav-section-label" style="margin-top:8px">Reports</div>
    <a th:href="@{/teacher/reports}" class="nav-link" th:classappend="${active == 'reports'} ? 'active'">
      <span class="nav-icon">▤</span> Reports
    </a>
  </nav>

  <div class="sidebar-footer">
    <form th:action="@{/logout}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <button type="submit" class="btn-logout">
        <span>⏻</span> Sign Out
      </button>
    </form>
  </div>
</aside>

<script>
(function () {
  /* 1. Apply saved theme before first paint */
  var saved = localStorage.getItem('trackio-theme') || 'light';
  if (saved === 'dark') document.documentElement.setAttribute('data-theme', 'dark');

  /* 2. Build toggle button */
  function makeBtn() {
    var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    var btn = document.createElement('button');
    btn.id = 'themeToggleBtn';
    btn.title = isDark ? 'Switch to Light Mode' : 'Switch to Dark Mode';
    btn.setAttribute('aria-label', 'Toggle dark mode');
    btn.style.cssText = [
      'display:inline-flex','align-items:center','gap:5px',
      'padding:4px 11px','border-radius:7px','cursor:pointer',
      'font-size:0.75rem','font-weight:600','letter-spacing:0.01em',
      'border:1px solid var(--border-color,#D4DCE8)',
      'background:var(--surface,#fff)',
      'color:var(--text-secondary,#555)',
      'transition:all 0.18s ease',
      'white-space:nowrap','flex-shrink:0',
      'margin-left:14px','vertical-align:middle'
    ].join(';');
    var sunSVG = '<svg width="13" height="13" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="5" stroke="currentColor" stroke-width="2"/><line x1="10" y1="1" x2="10" y2="3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="10" y1="17" x2="10" y2="19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="1" y1="10" x2="3" y2="10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="17" y1="10" x2="19" y2="10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="3.5" y1="3.5" x2="5" y2="5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="15" y1="15" x2="16.5" y2="16.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="15" y1="5" x2="16.5" y2="3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="3.5" y1="16.5" x2="5" y2="15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
    var moonSVG = '<svg width="13" height="13" viewBox="0 0 20 20" fill="none"><path d="M17.5 11.5A7.5 7.5 0 018.5 2.5a7.5 7.5 0 100 15 7.5 7.5 0 009-6z" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
    btn.innerHTML = isDark ? (sunSVG + ' Light') : (moonSVG + ' Dark');
    btn.onclick = function () {
      var dark = document.documentElement.getAttribute('data-theme') === 'dark';
      if (dark) {
        document.documentElement.removeAttribute('data-theme');
        localStorage.setItem('trackio-theme', 'light');
      } else {
        document.documentElement.setAttribute('data-theme', 'dark');
        localStorage.setItem('trackio-theme', 'dark');
      }
      btn.replaceWith(makeBtn());
    };
    btn.onmouseenter = function () {
      this.style.background = 'var(--diu-blue-pale,#E3EEF9)';
      this.style.borderColor = 'var(--diu-blue,#034EA2)';
      this.style.color = 'var(--diu-blue,#034EA2)';
    };
    btn.onmouseleave = function () {
      this.style.background = 'var(--surface,#fff)';
      this.style.borderColor = 'var(--border-color,#D4DCE8)';
      this.style.color = 'var(--text-secondary,#555)';
    };
    return btn;
  }

  /* 3. Inject AFTER topbar-title (left side of topbar, beside CIS) */
  function inject() {
    if (document.getElementById('themeToggleBtn')) return;
    var title = document.querySelector('.topbar-title');
    if (title && title.parentNode) {
      title.parentNode.insertBefore(makeBtn(), title.nextSibling);
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', inject);
  } else {
    inject();
  }
})();
</script>

</body>
</html>

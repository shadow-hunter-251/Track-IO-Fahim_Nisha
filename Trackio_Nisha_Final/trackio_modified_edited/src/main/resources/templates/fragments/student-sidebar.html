<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Student Sidebar Fragment -->
<aside th:fragment="sidebar(active)" class="sidebar">

  <!-- Brand / logo -->
  <div class="sidebar-brand">
    <div class="brand-icon-wrapper">
      <svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
        <line x1="3" y1="11" x2="25" y2="11" stroke="rgba(255,255,255,0.45)" stroke-width="1.8" stroke-linecap="round"/>
        <line x1="3" y1="19" x2="25" y2="19" stroke="rgba(255,255,255,0.45)" stroke-width="1.8" stroke-linecap="round"/>
        <line x1="7"  y1="8" x2="7"  y2="22" stroke="rgba(255,255,255,0.3)" stroke-width="1.4" stroke-linecap="round"/>
        <line x1="14" y1="8" x2="14" y2="22" stroke="rgba(255,255,255,0.3)" stroke-width="1.4" stroke-linecap="round"/>
        <line x1="21" y1="8" x2="21" y2="22" stroke="rgba(255,255,255,0.3)" stroke-width="1.4" stroke-linecap="round"/>
        <line x1="7"  y1="8" x2="21" y2="8"  stroke="white" stroke-width="3" stroke-linecap="round"/>
        <line x1="14" y1="8" x2="14" y2="22" stroke="white" stroke-width="3" stroke-linecap="round"/>
        <circle cx="21" cy="20" r="3" fill="#39B54A"/>
        <circle cx="21" cy="20" r="1.4" fill="white"/>
      </svg>
    </div>
    <h2>Trackio-DIU</h2>
    <p>Student Portal · DIU</p>
  </div>

  <!-- User info -->
  <div class="sidebar-user">
    <div class="user-avatar"
         th:with="hasPhoto=${student != null and student.profilePhotoUrl != null and !#strings.isEmpty(student.profilePhotoUrl)}"
         th:style="${hasPhoto} ? |background-image:url('${student.profilePhotoUrl}');background-size:cover;background-position:center;color:transparent| : ''">
      <span th:if="${!hasPhoto}" th:text="${student != null ? student.name.substring(0,1) : 'S'}">S</span>
    </div>
    <div class="user-info">
      <strong th:text="${student != null ? student.name : 'Student'}">Student</strong>
      <span th:text="${student != null ? student.studentId : ''}"></span>
    </div>
  </div>

  <nav class="sidebar-nav">
    <div class="nav-section-label">Overview</div>
    <a th:href="@{/student/dashboard}" class="nav-link" th:classappend="${active == 'dashboard'} ? 'active'">
      <span class="nav-icon">⊞</span> Dashboard
    </a>
    <a th:href="@{/student/profile}" class="nav-link" th:classappend="${active == 'profile'} ? 'active'">
      <span class="nav-icon">◉</span> My Profile
    </a>

    <div class="nav-section-label" style="margin-top:8px">Portfolio</div>
    <a th:href="@{/student/projects}" class="nav-link" th:classappend="${active == 'projects'} ? 'active'">
      <span class="nav-icon">◈</span> Projects
    </a>
    <a th:href="@{/student/certifications}" class="nav-link" th:classappend="${active == 'certs'} ? 'active'">
      <span class="nav-icon">✦</span> Certifications
    </a>
    <a th:href="@{/student/achievements}" class="nav-link" th:classappend="${active == 'achievements'} ? 'active'">
      <span class="nav-icon">★</span> Achievements
    </a>
    <a th:href="@{/student/internships}" class="nav-link" th:classappend="${active == 'internships'} ? 'active'">
      <span class="nav-icon">⚙</span> Internships
    </a>
    <a th:href="@{/student/skills}" class="nav-link" th:classappend="${active == 'skills'} ? 'active'">
      <span class="nav-icon">◆</span> Skills
    </a>

    <div class="nav-section-label" style="margin-top:8px">AI Tools</div>
    <a th:href="@{/student/ai/duplicate-checker}" class="nav-link" th:classappend="${active == 'ai-checker'} ? 'active'">
      <span class="nav-icon">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" style="vertical-align:middle">
          <circle cx="8" cy="8" r="3" fill="currentColor" opacity="0.9"/>
          <circle cx="8" cy="1.5" r="1.5" fill="currentColor" opacity="0.55"/>
          <circle cx="8" cy="14.5" r="1.5" fill="currentColor" opacity="0.55"/>
          <circle cx="1.5" cy="8" r="1.5" fill="currentColor" opacity="0.55"/>
          <circle cx="14.5" cy="8" r="1.5" fill="currentColor" opacity="0.55"/>
          <line x1="8" y1="5.2" x2="8" y2="3" stroke="currentColor" stroke-width="1" opacity="0.5"/>
          <line x1="8" y1="10.8" x2="8" y2="13" stroke="currentColor" stroke-width="1" opacity="0.5"/>
          <line x1="5.2" y1="8" x2="3" y2="8" stroke="currentColor" stroke-width="1" opacity="0.5"/>
          <line x1="10.8" y1="8" x2="13" y2="8" stroke="currentColor" stroke-width="1" opacity="0.5"/>
        </svg>
      </span> Project Checker
    </a>

    <a th:href="@{/student/ai/job-finder}" class="nav-link" th:classappend="${active == 'job-finder'} ? 'active'">
      <span class="nav-icon">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" style="vertical-align:middle">
          <rect x="1" y="5" width="14" height="9" rx="2" stroke="currentColor" stroke-width="1.3" fill="none" opacity="0.9"/>
          <path d="M5 5V4a3 3 0 016 0v1" stroke="currentColor" stroke-width="1.3" fill="none" opacity="0.7"/>
          <line x1="8" y1="9" x2="8" y2="11" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" opacity="0.8"/>
          <circle cx="8" cy="9" r="1" fill="currentColor" opacity="0.9"/>
        </svg>
      </span> Job Finder
    </a>

    <div class="nav-section-label" style="margin-top:8px">Reports</div>
    <a th:href="@{/student/report}" class="nav-link" th:classappend="${active == 'report'} ? 'active'">
      <span class="nav-icon">▤</span> My Report
    </a>
    <a th:href="@{/student/cv}" class="nav-link" th:classappend="${active == 'cv'} ? 'active'">
      <span class="nav-icon">📄</span> Generate CV
    </a>
  </nav>

  <div class="sidebar-footer">
    <form th:action="@{/logout}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <button type="submit" class="btn-logout">
        <span>⏻</span> Sign Out
      </button>
    </form>
  </div>
</aside>

<!-- ═══ THEME ENGINE — runs on every page that includes this sidebar ═══
     Strategy: apply saved theme instantly (pre-paint), then after DOM
     is ready inject a toggle button into .topbar-actions so it appears
     in the top navigation bar next to existing actions.
-->
<script>
(function () {
  /* 1. Apply saved theme before first paint */
  var saved = localStorage.getItem('trackio-theme') || 'light';
  if (saved === 'dark') document.documentElement.setAttribute('data-theme', 'dark');

  /* 2. Build toggle button */
  function makeBtn() {
    var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    var btn = document.createElement('button');
    btn.id = 'themeToggleBtn';
    btn.title = isDark ? 'Switch to Light Mode' : 'Switch to Dark Mode';
    btn.setAttribute('aria-label', 'Toggle dark mode');
    btn.style.cssText = [
      'display:inline-flex','align-items:center','gap:5px',
      'padding:4px 11px','border-radius:7px','cursor:pointer',
      'font-size:0.75rem','font-weight:600','letter-spacing:0.01em',
      'border:1px solid var(--border-color,#D4DCE8)',
      'background:var(--surface,#fff)',
      'color:var(--text-secondary,#555)',
      'transition:all 0.18s ease',
      'white-space:nowrap','flex-shrink:0',
      'margin-left:14px','vertical-align:middle'
    ].join(';');
    var sunSVG = '<svg width="13" height="13" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="5" stroke="currentColor" stroke-width="2"/><line x1="10" y1="1" x2="10" y2="3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="10" y1="17" x2="10" y2="19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="1" y1="10" x2="3" y2="10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="17" y1="10" x2="19" y2="10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="3.5" y1="3.5" x2="5" y2="5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="15" y1="15" x2="16.5" y2="16.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="15" y1="5" x2="16.5" y2="3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="3.5" y1="16.5" x2="5" y2="15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
    var moonSVG = '<svg width="13" height="13" viewBox="0 0 20 20" fill="none"><path d="M17.5 11.5A7.5 7.5 0 018.5 2.5a7.5 7.5 0 100 15 7.5 7.5 0 009-6z" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
    btn.innerHTML = isDark ? (sunSVG + ' Light') : (moonSVG + ' Dark');
    btn.onclick = function () {
      var dark = document.documentElement.getAttribute('data-theme') === 'dark';
      if (dark) {
        document.documentElement.removeAttribute('data-theme');
        localStorage.setItem('trackio-theme', 'light');
      } else {
        document.documentElement.setAttribute('data-theme', 'dark');
        localStorage.setItem('trackio-theme', 'dark');
      }
      btn.replaceWith(makeBtn());
    };
    btn.onmouseenter = function () {
      this.style.background = 'var(--diu-blue-pale,#E3EEF9)';
      this.style.borderColor = 'var(--diu-blue,#034EA2)';
      this.style.color = 'var(--diu-blue,#034EA2)';
    };
    btn.onmouseleave = function () {
      this.style.background = 'var(--surface,#fff)';
      this.style.borderColor = 'var(--border-color,#D4DCE8)';
      this.style.color = 'var(--text-secondary,#555)';
    };
    return btn;
  }

  /* 3. Inject AFTER topbar-title (left side of topbar, beside CIS) */
  function inject() {
    if (document.getElementById('themeToggleBtn')) return;
    var title = document.querySelector('.topbar-title');
    if (title && title.parentNode) {
      title.parentNode.insertBefore(makeBtn(), title.nextSibling);
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', inject);
  } else {
    inject();
  }
})();
</script>

</body>
</html>
